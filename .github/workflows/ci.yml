name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung job otherwise runs to the six-hour default. One did, four times
    # over, which is how Node 18 went unverified through a whole release.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node tools/generate.js --check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
