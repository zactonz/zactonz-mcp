name: Release

# Publishes to npm when a version tag is pushed. Publishing is skipped, rather
# than failed, until the NPM_TOKEN secret exists: the secrets context cannot be
# read from an `if`, so it is mapped to an env var the steps can test.
#
# The MCP Registry is NOT published here, though it was until 0.3.0. A scoped
# npm publish lands in a staging area that a person has to release on npmjs.com,
# so when this workflow reaches the end the version its manifest names is still
# not installable and the registry refuses it. It failed that way on every
# release, and a step that always fails teaches people to ignore a red run.
# Registry publishing moved to registry.yml, run by hand once npm is live.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Verify the package builds
        run: npm pack --dry-run
      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Say what is left to do
        if: env.HAS_NPM_TOKEN == 'true'
        run: |
          {
            echo "### Published to npm"
            echo
            echo "\`$GITHUB_REF_NAME\` is published. Two things remain, in order:"
            echo
            echo "1. Release it on npmjs.com if it is waiting in staging, which a scoped publish is."
            echo "2. Run the **Publish to the MCP Registry** workflow from this tag."
            echo
            echo "The registry entry names an npm version, so it is published only once that"
            echo "version can actually be installed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a skipped publish
        if: env.HAS_NPM_TOKEN != 'true'
        run: |
          {
            echo "### Publish skipped"
            echo
            echo "No \`NPM_TOKEN\` secret is set, so \`$GITHUB_REF_NAME\` was built and checked but"
            echo "published to npm. The MCP Registry is published separately, by the"
            echo "\`Publish to the MCP Registry\` workflow, and names an npm version, so it"
            echo "is not published while the package is not."
            echo
            echo "To publish: create the npm org, add a granular access token with write access to"
            echo "\`@zactonz/*\` as the repository secret \`NPM_TOKEN\`, then re-run this workflow."
            echo "The registry step needs no secret; it uses this workflow's OIDC token."
          } >> "$GITHUB_STEP_SUMMARY"
